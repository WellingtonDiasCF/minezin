<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Minezin Emo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<style>
/* =====================================================================
   MINEZIN EMO — dossie de ardosia
   Fundo de deepslate: azul-preto, nao preto neutro. Tipografia em osso.
   O ambar de tocha e reservado ao que se clica; verde, ouro e redstone
   dizem estado. Cor cromatica de verdade so dentro do mapa, onde ela e
   dado e nao enfeite. Tema unico e escuro por escolha — a pagina pinta o
   proprio fundo e nunca empresta o tema do host.
   ===================================================================== */
:root{
  --ground:#0E1216; --surface:#161B21; --sunk:#0A0D10; --raised:#1E242B;
  --ink:#E9EDF1; --ink-2:#B6C1CB; --muted:#7C8996; --faint:#54606C;
  --line:#212930; --line-2:#2F3941;
  --bone:#E6DCC6; --bone-dim:#8E8778;
  --red:#E09A45; --red-hi:#F0B76B; --red-soft:#1E1710; --red-line:#4B3A1E;
  --ok:#52A87B; --ok-soft:#101B15;
  --warn:#C4A03A; --warn-soft:#1B1810;
  --crit:#D45A4E; --crit-soft:#1D1211;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 18px 40px -26px rgba(0,0,0,.95);
  --r:6px; --r-lg:10px;
  --display:"IBM Plex Sans Condensed","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --head-h:56px;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box; min-width:0}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.6;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--display); margin:0; text-wrap:balance; color:var(--ink); font-weight:600; line-height:1.15}
p{margin:0}
a{color:var(--red-hi); text-underline-offset:3px; text-decoration-thickness:1px}
a:hover{color:var(--bone)}
:focus-visible{outline:2px solid var(--red); outline-offset:2px; border-radius:2px}
::selection{background:var(--red); color:#12161A}
b,strong{font-weight:600; color:var(--ink)}

.wrap{max-width:1160px; margin:0 auto; padding:0 18px 80px}
@media (min-width:1040px){
  .wrap{display:grid; grid-template-columns:222px minmax(0,1fr); gap:44px; align-items:start; padding:0 32px 110px}
}

/* ============ topo ============
   O nome rola embora no celular; quem fica grudado e a navegacao, sozinha
   no topo. Sem soma de alturas e sem faixa transparente entre as duas
   barras — que era por onde o texto da pagina passava por tras da nav. */
.topbar{background:var(--ground); border-bottom:1px solid var(--line)}
.topbar-in{max-width:1160px; margin:0 auto; padding:13px 18px; display:flex; align-items:center; gap:12px}
@media (min-width:1040px){
  .topbar{position:sticky; top:0; z-index:40}
  .topbar-in{padding:14px 32px}
}
.mark{display:flex; align-items:baseline; gap:10px; min-width:0; flex:1}
.glyph{
  align-self:center; width:26px; height:26px; flex:0 0 auto; display:grid; place-items:center;
  background:var(--bone); color:#12161A; border-radius:3px;
  font:700 11px/1 var(--mono); letter-spacing:-.02em;
}
.mark b{
  font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--bone); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
}
.mark i{font-style:normal; color:var(--faint); font:500 11px/1 var(--mono); letter-spacing:.08em; white-space:nowrap; display:none}
@media (min-width:560px){.mark i{display:inline}}
.topbar .spacer{display:none}
.livechip{
  display:inline-flex; align-items:center; gap:7px; height:26px; padding:0 10px; flex:0 0 auto;
  border:1px solid var(--line-2); border-radius:3px; background:var(--sunk); color:var(--muted);
  font:600 10px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase; white-space:nowrap;
}
.livechip::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px rgba(82,168,123,.16)}

/* ============ navegacao ============ */
nav.rail{
  position:sticky; top:0; z-index:30; background:var(--ground);
  margin:0 -18px 26px; border-bottom:1px solid var(--line);
}
.rail-scroll{
  display:flex; gap:2px; overflow-x:auto; padding:0 12px; scrollbar-width:none;
  scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
}
.rail-scroll::-webkit-scrollbar{display:none}
.navbtn{
  flex:0 0 auto; scroll-snap-align:start; min-height:46px; padding:0 12px;
  border:0; border-bottom:2px solid transparent; background:none; color:var(--muted);
  font:600 15px/1 var(--body); cursor:pointer; white-space:nowrap;
  display:inline-flex; align-items:center; gap:8px; letter-spacing:.01em;
}
.navbtn .n{font:500 10px/1 var(--mono); color:var(--faint); letter-spacing:.06em}
.navbtn:hover{color:var(--ink-2)}
.navbtn[aria-current="true"]{color:var(--bone); border-bottom-color:var(--red)}
.navbtn[aria-current="true"] .n{color:var(--red)}
@media (min-width:1040px){
  nav.rail{
    top:calc(var(--head-h) + 26px); margin:26px 0 0; border:0;
    padding:2px 0; align-self:start;
  }
  .rail-scroll{flex-direction:column; overflow:visible; padding:0; gap:0}
  .navbtn{
    width:100%; justify-content:flex-start; min-height:0; padding:9px 0 9px 14px;
    border-bottom:0; border-left:1px solid var(--line); font-size:15.5px;
  }
  .navbtn:hover{border-left-color:var(--line-2); color:var(--ink-2)}
  .navbtn[aria-current="true"]{border-left:1px solid var(--red); color:var(--bone)}
}

/* ============ secoes ============ */
.page{display:none}
.page.on{display:block; animation:sobe .26s ease both}
@keyframes sobe{from{opacity:.55; transform:translateY(4px)}to{opacity:1; transform:none}}
main>.page>section{padding-top:34px; margin-top:34px; border-top:1px solid var(--line)}
main>.page>section:first-child{padding-top:26px; margin-top:0; border-top:0}
main>.page>.hero+section{border-top:0; margin-top:0; padding-top:6px}
.sec-head{margin-bottom:18px; max-width:66ch}
.eyebrow{font:600 10.5px/1 var(--mono); letter-spacing:.2em; text-transform:uppercase; color:var(--bone-dim); display:block; margin-bottom:11px}
.sec-head h2{font-size:clamp(21px,4.4vw,29px); font-weight:600; letter-spacing:-.005em; color:var(--bone)}
.sec-head p{color:var(--muted); font-size:15.5px; margin-top:9px}
h1.big{
  font-family:var(--display); font-size:clamp(38px,10vw,74px); font-weight:700;
  line-height:.98; letter-spacing:-.022em; color:var(--bone); text-transform:none;
}

/* ============ abertura ============ */
.hero{margin:6px 0 8px; padding-bottom:30px; border-bottom:1px solid var(--line)}
.hero-top{padding:0}
.hero-top p.lead{color:var(--ink-2); font-size:17px; line-height:1.62; margin-top:18px; max-width:60ch}
.rule{display:none}
.seedrow{display:flex; flex-wrap:wrap; gap:0; margin-top:24px; border:1px solid var(--line); border-radius:var(--r)}
.seedchip{
  display:inline-flex; align-items:baseline; gap:8px; flex:1 1 auto; padding:11px 14px;
  background:none; border:0; border-right:1px solid var(--line);
  font:400 12px/1.2 var(--mono); color:var(--muted);
  letter-spacing:.1em; text-transform:uppercase; white-space:nowrap;
}
.seedrow .seedchip:last-child{border-right:0}
.seedchip b{font:600 15px/1.2 var(--mono); color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:0; text-transform:none}
button.seedchip{cursor:pointer}
button.seedchip:hover{background:var(--surface)}
@media (max-width:560px){
  .seedrow{flex-direction:column}
  .seedchip{border-right:0; border-bottom:1px solid var(--line); justify-content:space-between}
  .seedrow .seedchip:last-child{border-bottom:0}
}

/* ============ mapa ============ */
.mapwrap{border:1px solid var(--line); border-radius:var(--r-lg); background:var(--sunk); overflow:hidden}
.mapgrid{display:grid; grid-template-columns:1fr}
@media (min-width:900px){.mapgrid{grid-template-columns:minmax(0,1fr) 268px}}
.mapbox{padding:12px; background:radial-gradient(circle at 50% 45%, rgba(224,154,69,.05), transparent 62%), var(--sunk)}
.mapbox svg{display:block; width:100%; height:auto; border-radius:4px}
.maplegend{border-top:1px solid var(--line); padding:18px; background:var(--surface)}
@media (min-width:900px){.maplegend{border-top:0; border-left:1px solid var(--line)}}
.maplegend h4{font:600 10.5px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--bone-dim); margin-bottom:13px}
.legrow{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--ink-2); padding:3.5px 0; line-height:1.35}
.legdot{width:10px; height:10px; border-radius:50%; flex:0 0 auto}
.legdot.sq{border-radius:2px}
.zoombar{display:flex; gap:0; margin-top:18px; border:1px solid var(--line-2); border-radius:var(--r); overflow:hidden}
.zoombtn{
  flex:1 1 0; min-height:38px; padding:8px 6px; border:0; border-right:1px solid var(--line-2);
  background:var(--sunk); color:var(--muted); font:500 12.5px/1 var(--mono); cursor:pointer; white-space:nowrap;
}
.zoombar .zoombtn:last-child{border-right:0}
.zoombtn:hover{color:var(--ink-2)}
.zoombtn[aria-pressed="true"]{background:var(--red); color:#12161A; font-weight:600}

/* ============ blocos ============ */
.grid{display:grid; gap:14px}
@media (min-width:660px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:660px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:520px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:940px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:18px; display:flex; flex-direction:column; gap:13px;
}
.card h3{font-size:17.5px; font-weight:600; letter-spacing:-.004em; color:var(--bone)}
.card .sub{color:var(--muted); font-size:13.5px; margin-top:5px; font-family:var(--body); line-height:1.4}
.card p{font-size:15.5px; color:var(--ink-2)}
.card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap}
.card-head>div{min-width:0; flex:1 1 190px}
.card.lift{background:var(--raised); border-color:var(--line-2); box-shadow:var(--shadow)}

.well{background:var(--sunk); border-radius:var(--r); padding:12px 14px; min-width:0}
.well .k{font:500 10px/1 var(--mono); letter-spacing:.13em; text-transform:uppercase; color:var(--faint)}
.well .v{font:600 15px/1.35 var(--mono); color:var(--ink); margin-top:8px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.well .v.sm{font-size:14px; font-weight:400; font-family:var(--body); color:var(--ink-2); line-height:1.45}
.well .v.red{color:var(--red-hi)}
.wells{display:grid; gap:9px; grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:720px){.wells.w4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:720px){.wells.w3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wells.addr{grid-template-columns:minmax(0,1fr)}
@media (min-width:420px){.wells.addr{grid-template-columns:minmax(0,1fr) 112px}}
.wells.addr .v{font-size:clamp(16px,4.4vw,21px); letter-spacing:-.01em}

.tag{
  display:inline-flex; align-items:center; min-height:23px; padding:2px 9px; border-radius:3px;
  font:600 11px/1 var(--mono); letter-spacing:.09em; text-transform:uppercase;
  background:var(--sunk); color:var(--muted); border:1px solid var(--line);
}
.tag.r{background:var(--red-soft); color:var(--red-hi); border-color:var(--red-line)}
.tag.b{background:var(--raised); color:var(--bone); border-color:var(--line-2)}
.tag.ok{background:var(--ok-soft); color:var(--ok); border-color:rgba(82,168,123,.3)}
.tag.warn{background:var(--warn-soft); color:var(--warn); border-color:rgba(196,160,58,.3)}
.tag.crit{background:var(--crit-soft); color:var(--crit); border-color:rgba(212,90,78,.3)}
.tags{display:flex; flex-wrap:wrap; gap:7px; align-items:center}

.note{
  border-left:2px solid var(--line-2); border-radius:0 var(--r) var(--r) 0;
  background:var(--sunk); padding:13px 15px; font-size:15px; color:var(--ink-2); line-height:1.55;
}
.note b{color:var(--ink)}
.note.warn{border-left-color:var(--warn); background:var(--warn-soft)}
.note.crit{border-left-color:var(--crit); background:var(--crit-soft)}
.note.ok{border-left-color:var(--ok); background:var(--ok-soft)}
.note.r{border-left-color:var(--red); background:var(--red-soft)}

ul.list{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
ul.list li{font-size:15px; color:var(--ink-2); padding-left:16px; position:relative; line-height:1.5}
ul.list li::before{content:""; position:absolute; left:0; top:9px; width:6px; height:2px; background:var(--bone-dim)}
ol.steps{margin:0; padding:0; list-style:none; counter-reset:s; display:flex; flex-direction:column; gap:11px}
ol.steps li{
  counter-increment:s; display:grid; grid-template-columns:20px minmax(0,1fr); gap:13px;
  font-size:15px; color:var(--ink-2); line-height:1.5; align-items:start;
}
ol.steps li::before{
  content:counter(s,decimal-leading-zero); color:var(--red);
  font:600 11px/1.55 var(--mono); letter-spacing:.02em;
}

details.acc{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden}
details.acc>summary{
  padding:13px 15px; cursor:pointer; font:600 15px/1.35 var(--body); color:var(--ink);
  list-style:none; display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:46px;
}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+"; font:400 18px/1 var(--mono); color:var(--red); flex:0 0 auto}
details.acc[open]>summary::after{content:"\2212"}
details.acc[open]>summary{border-bottom:1px solid var(--line); color:var(--bone)}
details.acc:hover{border-color:var(--line-2)}
.acc-body{padding:15px; display:flex; flex-direction:column; gap:13px}

/* ============ filtros e botoes ============ */
.filters{display:flex; flex-wrap:wrap; gap:9px; margin-bottom:16px}
.filters input, .filters select{
  font:400 16px/1 var(--body); min-height:44px; padding:11px 13px; color:var(--ink);
  background:var(--sunk); border:1px solid var(--line-2); border-radius:var(--r);
}
.filters input{flex:1 1 200px}
.filters select{flex:0 1 auto; max-width:100%}
.filters input::placeholder{color:var(--faint)}
.filters input:focus, .filters select:focus{border-color:var(--red); outline:none; box-shadow:0 0 0 3px rgba(224,154,69,.16)}
.btn{
  min-height:44px; padding:11px 17px; border-radius:var(--r); cursor:pointer;
  font:600 15px/1 var(--body); border:1px solid var(--line-2); background:var(--sunk); color:var(--ink-2);
  transition:border-color .14s ease, color .14s ease, background .14s ease;
}
.btn:hover{border-color:var(--bone-dim); color:var(--ink)}
.btn.p{background:var(--red); border-color:var(--red); color:#12161A; font-weight:600}
.btn.p:hover{background:var(--red-hi); border-color:var(--red-hi); color:#12161A}
.empty{padding:30px; text-align:center; color:var(--muted); font-size:15px; border:1px dashed var(--line-2); border-radius:var(--r-lg)}
.hidden{display:none !important}

/* ============ tabelas de dados ============
   Sem cartao: regua fina entre linhas. Abaixo de 460px cada linha vira
   duas, para o valor nunca encostar no nome. */
.coord{border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; background:var(--surface)}
.coord-row{
  display:grid; grid-template-columns:minmax(0,1fr) minmax(0,auto);
  gap:4px 16px; padding:13px 15px; align-items:baseline;
}
.coord-row+.coord-row{border-top:1px solid var(--line)}
.coord-row:hover{background:var(--raised)}
.coord-row .nm{font-weight:500; font-size:15px; color:var(--ink); min-width:0; line-height:1.35}
.coord-row .nm small{display:block; color:var(--muted); font-weight:400; font-size:13px; margin-top:3px; line-height:1.4}
.coord-row .xyz{
  font:500 13.5px/1.4 var(--mono); color:var(--bone); text-align:right;
  font-variant-numeric:tabular-nums; white-space:nowrap; min-width:0;
}
.coord-row .xyz em{display:block; font-style:normal; font-weight:400; font-size:11.5px; color:var(--muted); margin-top:4px; letter-spacing:.04em}
.coord-row.head{
  background:var(--sunk); font:600 10px/1 var(--mono); letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint); padding:10px 15px;
}
.coord-row.head:hover{background:var(--sunk)}
.coord-row.head .xyz{color:var(--faint); font-size:10px; letter-spacing:.14em}
@media (max-width:459px){
  .coord-row{grid-template-columns:minmax(0,1fr)}
  .coord-row .xyz{text-align:left; white-space:normal; margin-top:2px}
  .coord-row .xyz em{margin-top:2px}
  .coord-row.head{display:none}
}

/* ============ diagramas ============ */
.blocks{display:grid; gap:2px; padding:10px; background:var(--sunk); border-radius:var(--r); border:1px solid var(--line)}
.cell{aspect-ratio:1; border-radius:1px}
.c-rock{background:#2B333B}
.c-air{background:transparent; box-shadow:inset 0 0 0 1px var(--line-2)}
.c-dig{background:var(--red-soft); box-shadow:inset 0 0 0 1px var(--red-line)}
.c-lava{background:#B4501F}
.c-water{background:#2E5F8C}
.c-safe{background:var(--ok)}
.c-item{background:var(--bone)}
.c-none{background:transparent}
.asciibox{
  font:400 12.5px/1.55 var(--mono); background:#070A0C; color:var(--bone-dim);
  padding:14px 15px; border-radius:var(--r); overflow-x:auto; white-space:pre;
  -webkit-overflow-scrolling:touch; border:1px solid var(--line);
}

/* ============ checklist ============ */
.chk{display:flex; align-items:flex-start; gap:12px; padding-top:13px; border-top:1px solid var(--line); cursor:pointer}
.chk input{width:20px; height:20px; margin:2px 0 0; accent-color:var(--red); flex:0 0 auto; cursor:pointer}
.chk span{font-size:15px; font-weight:600; color:var(--ink); line-height:1.35}
.card.done{border-color:rgba(82,168,123,.45); background:var(--ok-soft)}
.card.done .chk span{color:var(--ok)}
.bar{height:6px; background:var(--sunk); overflow:hidden; border-radius:3px; border:1px solid var(--line)}
.bar>i{display:block; height:100%; background:var(--red); transition:width .24s ease}
.syncdot{display:inline-flex; align-items:center; gap:7px; font:400 12px/1 var(--mono); color:var(--muted); letter-spacing:.06em}
.syncdot::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--faint)}
.syncdot.live::before{background:var(--ok); box-shadow:0 0 0 3px rgba(82,168,123,.16)}

footer{
  margin-top:56px; padding-top:26px; border-top:1px solid var(--line);
  color:var(--muted); font-size:14px; display:flex; flex-direction:column; gap:10px; line-height:1.55;
}
footer b{color:var(--ink-2)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none !important; animation:none !important}
}
</style>

<header class="topbar">
  <div class="topbar-in">
    <div class="mark">
      <span class="glyph" aria-hidden="true">ME</span>
      <b>Minezin Emo</b>
      <i>Bedrock 1.26.45</i>
    </div>
    <span class="livechip">No ar</span>
  </div>
</header>

<div class="wrap">
  <nav class="rail" aria-label="Seções do guia">
    <div class="rail-scroll" id="railScroll"></div>
  </nav>
  <main id="main"></main>
</div>
<script>
/* =====================================================================
   MINEZIN EMO — companheiro do servidor
   Coordenadas: medidas com /locate na propria 1.26.45, seed 2684991254.
   O console roda o locate a partir da origem 0,0 — as distancias sao
   contadas dali, nao do spawn.
   ===================================================================== */

const MUNDO = {

/* Cor de cada bioma, aproximando o tom real do jogo visto de cima. */
const COR_BIOMA = {
  cherry_grove:"#D98AAE", meadow:"#7FBF63", plains:"#8DB360", sunflower_plains:"#C6BE55",
  flower_forest:"#82AC63", forest:"#4E7A3C", birch_forest:"#7CA05C", taiga:"#3F6B50",
  pale_garden:"#8C9A8C", savanna:"#BDB556", savanna_plateau:"#A89B4E",
  desert:"#DFD08C", jungle:"#2F6B2F", bamboo_jungle:"#3E7A34", mangrove_swamp:"#4B6B45",
  frozen_peaks:"#DCE7EF", snowy_slopes:"#CFDCE6", grove:"#BACBD3", jagged_peaks:"#C3CBD4",
  stony_peaks:"#9AA0A6", beach:"#D8CEA2", river:"#3E6E9E",
  ocean:"#2C5C86", cold_ocean:"#2A5478", deep_ocean:"#22486B", deep_cold_ocean:"#1E4162",
  lukewarm_ocean:"#326892", deep_lukewarm_ocean:"#28557C", warm_ocean:"#3A79A6"
};
/* Biomas de caverna nao pintam a superficie: viram marcador. */
const SUBTERRANEO = new Set(["dripstone_caves","lush_caves","deep_dark"]);

function svgMapa(raio){
  const S = 640, pad = 30, C = S/2, area = S - pad*2;
  const escala = area / (raio*2);
  const px = p => [pad + (p.x + raio)*escala, pad + (p.z + raio)*escala];

  const superficie = BIOMAS.filter(b => !SUBTERRANEO.has(b.id));
  const cavernas   = BIOMAS.filter(b =>  SUBTERRANEO.has(b.id));
  const est        = ESTRUTURAS.filter(e => Math.abs(e.x)<=raio && Math.abs(e.z)<=raio);

  let g = `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="Mapa de biomas da seed, preenchido a partir das amostras medidas">`;
  g += `<defs><clipPath id="cm"><rect x="${pad}" y="${pad}" width="${area}" height="${area}" rx="4"/></clipPath></defs>`;
  g += `<rect x="0" y="0" width="${S}" height="${S}" fill="#0A0D10"/>`;
  g += `<g clip-path="url(#cm)">`;

  /* Preenchimento por vizinho mais proximo: cada celula recebe a cor do
     bioma medido mais perto dela. E aproximacao a partir das amostras, nao
     leitura chunk a chunk.
     Celulas vizinhas de mesma cor viram uma faixa unica, para nao despejar
     milhares de retangulos no DOM do celular. */
  const N = 56, passo = area/N;
  for(let j=0;j<N;j++){
    const wz = -raio + (j+0.5)*(raio*2/N);
    let corAtual = null, iniciou = 0;
    const fecha = (ate) => {
      if(corAtual === null) return;
      const x = pad + iniciou*passo, w = (ate-iniciou)*passo + 0.6;
      g += `<rect x="${x.toFixed(1)}" y="${(pad+j*passo).toFixed(1)}" width="${w.toFixed(1)}" height="${(passo+0.6).toFixed(1)}" fill="${corAtual}" opacity=".9"/>`;
    };
    for(let i=0;i<N;i++){
      const wx = -raio + (i+0.5)*(raio*2/N);
      let melhor=null, dmin=Infinity;
      for(const b of superficie){
        const d = (b.x-wx)*(b.x-wx) + (b.z-wz)*(b.z-wz);
        if(d<dmin){ dmin=d; melhor=b; }
      }
      const cor = melhor ? (COR_BIOMA[melhor.id] || "#5F8D6A") : null;
      if(cor !== corAtual){ fecha(i); corAtual = cor; iniciou = i; }
    }
    fecha(N);
  }
  g += `</g>`;

  /* malha de coordenadas por cima */
  for(let k=0;k<=8;k++){
    const t = pad + k*(area/8);
    g += `<line x1="${t.toFixed(1)}" y1="${pad}" x2="${t.toFixed(1)}" y2="${S-pad}" stroke="#0A0D10" stroke-width="1" opacity=".35"/>`;
    g += `<line x1="${pad}" y1="${t.toFixed(1)}" x2="${S-pad}" y2="${t.toFixed(1)}" stroke="#0A0D10" stroke-width="1" opacity=".35"/>`;
  }
  const marca = [-raio, -raio/2, 0, raio/2, raio];
  marca.forEach((v,idx)=>{
    const t = pad + (idx/4)*area;
    g += `<text x="${t.toFixed(1)}" y="${(pad-9).toFixed(1)}" fill="#7C8996" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9.5" text-anchor="middle">${v}</text>`;
    g += `<text x="${(pad-7).toFixed(1)}" y="${(t+3).toFixed(1)}" fill="#7C8996" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9.5" text-anchor="end">${v}</text>`;
  });
  g += `<rect x="${pad}" y="${pad}" width="${area}" height="${area}" fill="none" stroke="#2F3941" stroke-width="1" rx="4"/>`;
  g += `<text x="${S-pad}" y="${S-pad+16}" fill="#54606C" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9.5" text-anchor="end">X leste →   Z sul ↓</text>`;

  /* cavernas medidas, como losango */
  cavernas.filter(b=>Math.abs(b.x)<=raio&&Math.abs(b.z)<=raio).forEach(b=>{
    const [x,y]=px(b);
    g += `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(45)"><rect x="-4" y="-4" width="8" height="8" fill="#0A0D10" stroke="#E09A45" stroke-width="1.8"/><title>${esc(b.nome)} — X ${b.x} / Z ${b.z} (${b.dist} blocos)</title></g>`;
  });

  /* estruturas */
  est.forEach(e=>{
    const [x,y]=px(e);
    g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="#0A0D10" opacity=".55"/>`;
    g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#0A0D10" stroke="#E6DCC6" stroke-width="1.8"><title>${esc(e.nome)} — X ${e.x} / Z ${e.z} (${e.dist} blocos)</title></circle>`;
  });

  /* rotulo das estruturas mais proximas */
  [...est].sort((a,b)=>a.dist-b.dist).slice(0, raio<=600?4:3).forEach(e=>{
    const [x,y]=px(e);
    const dir = x>C? -1 : 1;
    const tx = (x+dir*10).toFixed(1), ty=(y+3.5).toFixed(1);
    const anc = x>C?"end":"start";
    g += `<text x="${tx}" y="${ty}" fill="#0A0D10" stroke="#0A0D10" stroke-width="3.5" stroke-linejoin="round" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="${anc}">${esc(e.nome)}</text>`;
    g += `<text x="${tx}" y="${ty}" fill="#E9EDF1" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="${anc}">${esc(e.nome)}</text>`;
  });

  /* spawn */
  const [sx,sy]=px(MUNDO.spawn);
  g += `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="10" fill="none" stroke="#0A0D10" stroke-width="4"/>`;
  g += `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="10" fill="none" stroke="#FFFFFF" stroke-width="2"/>`;
  g += `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="2.5" fill="#FFFFFF"/>`;
  g += `<text x="${(sx+15).toFixed(1)}" y="${(sy-11).toFixed(1)}" fill="#0A0D10" stroke="#0A0D10" stroke-width="4" stroke-linejoin="round" font-family="IBM Plex Sans Condensed, system-ui, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.4">SPAWN</text>`;
  g += `<text x="${(sx+15).toFixed(1)}" y="${(sy-11).toFixed(1)}" fill="#FFFFFF" font-family="IBM Plex Sans Condensed, system-ui, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.4">SPAWN</text>`;
  g += `</svg>`;
  return g;
}

const MAPA_CEL = {".":"c-none","A":"c-air","R":"c-rock","D":"c-dig","L":"c-lava","W":"c-water","S":"c-safe","I":"c-item"};

function diagrama(tipo){
  const d = DIAGRAMAS[tipo] || DIAGRAMAS.branch;
  const linhas = d[1], cols = linhas[0].length;
  const cels = linhas.join("").split("").map(c=>`<div class="cell ${MAPA_CEL[c]||"c-none"}"></div>`).join("");
  return `<div>
    <div class="blocks" style="grid-template-columns:repeat(${cols},minmax(0,1fr))" role="img" aria-label="${esc(d[0])}">${cels}</div>
    <p style="color:var(--muted);font-size:13px;margin-top:7px">${esc(d[0])}</p>
  </div>`;
}

const RODAPE = `<footer>
  <div><b>Minezin Emo</b> · servidor Bedrock ${esc(MUNDO.versao)} · mundo ${esc(MUNDO.nome)} · seed ${esc(MUNDO.seed)}</div>
  <div>Coordenadas medidas com <span style="font-family:var(--mono)">locate</span> rodado no próprio servidor, a partir da origem X 0 / Z 0. Nada foi copiado de site de seed.</div>
  <div>Preços de villager são valores base, antes de desconto por cura, reputação e Herói da Vila. O mundo roda o addon Better Trades, então alguns números ficam mais camaradas que o vanilla.</div>
</footer>`;

let atual = "entrar";

function montarNav(){
  el("railScroll").innerHTML = SECOES.map(s=>
    `<button class="navbtn" type="button" data-sec="${s.id}" aria-current="${s.id===atual}"><span class="n">${s.n}</span>${esc(s.nome)}</button>`
  ).join("");
}

function abrir(id){
  if(!PAGINAS[id]) id = "entrar";
  atual = id;
  document.querySelectorAll("[data-sec]").forEach(b=>b.setAttribute("aria-current", String(b.dataset.sec===id)));
  el("main").innerHTML = `<div class="page on">${PAGINAS[id]()}${RODAPE}</div>`;
  ligar(id);
  window.scrollTo({top:0, behavior:"instant"});
  const btn = document.querySelector('[data-sec="'+id+'"]');
  if(btn && window.innerWidth < 1000) btn.scrollIntoView({block:"nearest", inline:"center"});
}

/* ---- copiar ---- */
document.addEventListener("click", async ev=>{
  const b = ev.target.closest("[data-copy]");
  if(!b) return;
  const txt = b.dataset.copy;
  try{
    await navigator.clipboard.writeText(txt);
  }catch(e){
    const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(_){}
    ta.remove();
  }
  const antes = b.textContent;
  b.textContent = "Copiado";
  setTimeout(()=>{ b.textContent = antes; }, 1400);
});

/* ---- navegacao ---- */
document.addEventListener("click", ev=>{
  const b = ev.target.closest("[data-sec]");
  if(!b) return;
  abrir(b.dataset.sec);
  history.replaceState(null,"", "#"+b.dataset.sec);
});

/* =====================================================================
   CHECKLIST COMPARTILHADA
   Guarda no db do artefato quando ele existe, para todo mundo que abre a
   pagina ver o mesmo progresso. Sem db, cai para o navegador local.
   ===================================================================== */
const CHAVE_LOCAL = "minezin-emo-checklist";
let marcados = {};
let dbRef = null;

try{
  const salvo = JSON.parse(localStorage.getItem(CHAVE_LOCAL) || "{}");
  if(salvo && typeof salvo === "object") marcados = salvo;
}catch(e){ marcados = {}; }

function salvarLocal(){
  try{ localStorage.setItem(CHAVE_LOCAL, JSON.stringify(marcados)); }catch(e){}
}

function salvar(){
  salvarLocal();
  if(dbRef){
    dbRef.set({marcados: marcados, atualizado: Date.now()}).catch(()=>{});
  }
}

async function ligarDb(){
  if(!window.claude || typeof window.claude.use !== "function") return;
  let db = null;
  try{ db = await window.claude.use("db"); }catch(e){ return; }
  if(!db) return;
  dbRef = db.doc("checklist/trading-hall");
  dbRef.onSnapshot(snap=>{
    const dados = snap && snap.exists ? snap.data() : null;
    if(dados && dados.marcados && typeof dados.marcados === "object"){
      marcados = dados.marcados;
      salvarLocal();
      if(atual === "villagers") desenhaChk();
    }
    const p = el("chkSync");
    if(p){ p.textContent = "compartilhado"; p.classList.add("live"); }
  }, ()=>{
    const p = el("chkSync");
    if(p){ p.textContent = "só neste aparelho"; p.classList.remove("live"); }
  });
}

/* =====================================================================
   FILTROS E DESENHOS POR SECAO
   ===================================================================== */
function texto(){ return Array.prototype.slice.call(arguments).map(x=>norm(JSON.stringify(x))).join(" "); }

/* ----- mundo ----- */
function linhaCoord(p, extra){
  const nx = Math.round(p.x/8), nz = Math.round(p.z/8);
  return `<div class="coord-row">
    <span class="nm">${esc(p.nome)}${extra?`<small>${esc(extra)}</small>`:""}</span>
    <span class="xyz">X ${p.x} / Z ${p.z}<em>${p.dist} blocos · portal no Nether X ${nx} / Z ${nz}</em></span>
  </div>`;
}

function desenhaEstruturas(){
  const q = norm((el("qEstrutura")||{}).value||"");
  const vis = ESTRUTURAS.filter(e=>!q || texto(e).indexOf(q)>=0);
  el("listaEstruturas").innerHTML = vis.length
    ? `<div class="coord-row head"><span>Estrutura</span><span class="xyz">Coordenada</span></div>` + vis.map(e=>linhaCoord(e,e.porque)).join("")
    : `<div class="coord-row"><span class="nm" style="color:var(--muted)">Nada encontrado.</span><span class="xyz"></span></div>`;
}

function desenhaBiomas(){
  const f = (el("fBioma")||{}).value||"todos";
  const q = norm((el("qBioma")||{}).value||"");
  const rot = {cenico:"Cênico",montanha:"Montanha",caverna:"Caverna",oceano:"Oceano",comum:"Comum",recurso:"Recurso"};
  const vis = BIOMAS.filter(b=>(f==="todos"||b.cat===f) && (!q || texto(b).indexOf(q)>=0));
  el("listaBiomas").innerHTML = vis.length
    ? `<div class="coord-row head"><span>Bioma</span><span class="xyz">Coordenada</span></div>` + vis.map(b=>linhaCoord(b,rot[b.cat]||b.cat)).join("")
    : `<div class="coord-row"><span class="nm" style="color:var(--muted)">Nada encontrado.</span><span class="xyz"></span></div>`;
}

/* ----- minerio ----- */
function desenhaMinerios(){
  const sel = (el("fMinerio")||{}).value||"";
  const q = norm((el("qMinerio")||{}).value||"");
  const grade = el("gradeMinerios"), det = el("detalheMinerio");
  if(sel){
    const m = MINERIOS.find(x=>x.id===sel);
    grade.innerHTML = ""; det.innerHTML = m ? detalheMinerio(m) : "";
    return;
  }
  det.innerHTML = "";
  const vis = MINERIOS.filter(m=>!q || texto(m).indexOf(q)>=0);
  grade.innerHTML = vis.length
    ? `<div class="grid g2">${vis.map(cartaoMinerio).join("")}</div>`
    : `<div class="empty">Nenhum minério com esse filtro.</div>`;
}

/* ----- encantar ----- */
function desenhaEnc(){
  const f = (el("fEnc")||{}).value||"todos";
  const q = norm((el("qEnc")||{}).value||"");
  const vis = ENCANTAMENTOS.filter(e=>(f==="todos"||e.cats.indexOf(f)>=0) && (!q || texto(e).indexOf(q)>=0));
  el("gradeEnc").innerHTML = vis.map(cartaoEnc).join("");
  el("vazioEnc").classList.toggle("hidden", vis.length>0);
}
function desenhaKits(){
  const f = (el("fKit")||{}).value||"todos";
  const q = norm((el("qKit")||{}).value||"");
  const vis = KITS.filter(k=>(f==="todos"||k.cat===f) && (!q || texto(k).indexOf(q)>=0));
  el("gradeKits").innerHTML = vis.map(cartaoKit).join("");
  el("vazioKit").classList.toggle("hidden", vis.length>0);
}

/* ----- villagers ----- */
function desenhaVil(){
  const f = (el("fVil")||{}).value||"todos";
  const q = norm((el("qVil")||{}).value||"");
  const vis = VILLAGERS.filter(v=>(f==="todos"||v.id===f) && (!q || texto(v).indexOf(q)>=0));
  el("gradeVil").innerHTML = vis.map(cartaoVil).join("");
  el("vazioVil").classList.toggle("hidden", vis.length>0);
}
function desenhaChk(){
  const fc = (el("fChkCat")||{}).value||"todos";
  const fs = (el("fChkStatus")||{}).value||"todos";
  const q = norm((el("qChk")||{}).value||"");
  const vis = CHECKLIST.filter(c=>{
    const feito = !!marcados[c.id];
    if(fc!=="todos" && c.cat!==fc) return false;
    if(fs==="pendente" && feito) return false;
    if(fs==="feito" && !feito) return false;
    return !q || texto(c).indexOf(q)>=0;
  });
  const g = el("gradeChk");
  if(!g) return;
  g.innerHTML = vis.map(c=>cartaoChk(c, !!marcados[c.id])).join("");
  el("vazioChk").classList.toggle("hidden", vis.length>0);
  const total = CHECKLIST.length;
  const feitos = CHECKLIST.filter(c=>marcados[c.id]).length;
  const pct = total ? Math.round(feitos/total*100) : 0;
  el("chkBarra").style.width = pct+"%";
  const ess = CHECKLIST.filter(c=>c.prio==="essencial");
  const essF = ess.filter(c=>marcados[c.id]).length;
  el("chkResumo").textContent = feitos+" de "+total+" villagers ("+pct+"%) · essenciais "+essF+" de "+ess.length;
}

/* ----- pocoes / farms / redstone ----- */
function desenhaPoc(){
  const f = (el("fPoc")||{}).value||"todos";
  const q = norm((el("qPoc")||{}).value||"");
  const vis = POCOES.filter(p=>(f==="todos"||p.cats.indexOf(f)>=0) && (!q || texto(p).indexOf(q)>=0));
  el("gradePoc").innerHTML = vis.map(cartaoPoc).join("");
  el("vazioPoc").classList.toggle("hidden", vis.length>0);
}
function desenhaFarms(){
  const f = (el("fFarm")||{}).value||"todos";
  const q = norm((el("qFarm")||{}).value||"");
  const vis = FARMS.filter(x=>(f==="todos"||x.cats.indexOf(f)>=0) && (!q || texto(x).indexOf(q)>=0));
  el("gradeFarm").innerHTML = vis.map(cartaoFarm).join("");
  el("vazioFarm").classList.toggle("hidden", vis.length>0);
}
function desenhaMat(){
  const q = norm((el("qMat")||{}).value||"");
  const vis = MATERIAIS.filter(m=>!q || norm(m.join(" ")).indexOf(q)>=0);
  el("listaMat").innerHTML = vis.length
    ? `<div class="coord-row head"><span>Material</span><span class="xyz">Melhor caminho</span></div>` + vis.map(m=>
        `<div class="coord-row"><span class="nm">${esc(m[0])}<small>${esc(m[5])}</small></span>
         <span class="xyz" style="font-family:var(--body);font-weight:600;white-space:normal;text-align:right;font-size:14px">${esc(m[3])}<em>quando: ${esc(m[6])}</em></span></div>`).join("")
    : `<div class="coord-row"><span class="nm" style="color:var(--muted)">Nada encontrado.</span><span class="xyz"></span></div>`;
}
function desenhaRed(){
  const f = (el("fRed")||{}).value||"todos";
  const q = norm((el("qRed")||{}).value||"");
  const mostraC = f!=="sistemas", mostraS = f!=="componentes";
  const cat = ["sinal","tempo","itens","farm"].indexOf(f)>=0 ? f : "";
  const vc = COMPONENTES.filter(c=>mostraC && (!cat||c.cats.indexOf(cat)>=0) && (!q || texto(c).indexOf(q)>=0));
  const vs = SISTEMAS.filter(s=>mostraS && (!cat||s.cats.indexOf(cat)>=0) && (!q || texto(s).indexOf(q)>=0));
  el("secComp").classList.toggle("hidden", vc.length===0);
  el("secSist").classList.toggle("hidden", vs.length===0);
  el("gradeComp").innerHTML = vc.map(cartaoComp).join("");
  el("gradeSist").innerHTML = vs.map(cartaoSist).join("");
  el("vazioRed").classList.toggle("hidden", vc.length+vs.length>0);
}

/* ---- liga os controles de cada pagina depois de montar ---- */
function on(id, ev, fn){ const n = el(id); if(n) n.addEventListener(ev, fn); }

function ligar(sec){
  if(sec==="mundo"){
    desenhaEstruturas(); desenhaBiomas();
    on("qEstrutura","input",desenhaEstruturas);
    on("fBioma","change",desenhaBiomas); on("qBioma","input",desenhaBiomas);
    const zb = el("zoomBar");
    if(zb) zb.addEventListener("click", ev=>{
      const b = ev.target.closest("[data-raio]"); if(!b) return;
      zb.querySelectorAll("[data-raio]").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
      el("mapBox").innerHTML = svgMapa(parseInt(b.dataset.raio,10));
    });
  }
  if(sec==="minerar"){
    desenhaMinerios();
    on("fMinerio","change",desenhaMinerios); on("qMinerio","input",desenhaMinerios);
    on("limpaMinerio","click",()=>{ if(el("fMinerio")) el("fMinerio").value=""; if(el("qMinerio")) el("qMinerio").value=""; desenhaMinerios(); });
    const g = el("gradeMinerios");
    if(g) g.addEventListener("click", ev=>{
      const b = ev.target.closest("[data-minerio]"); if(!b) return;
      el("fMinerio").value = b.dataset.minerio; desenhaMinerios(); window.scrollTo({top:0,behavior:"smooth"});
    });
    const d = el("detalheMinerio");
    if(d) d.addEventListener("click", ev=>{
      if(!ev.target.closest("#voltaMinerios")) return;
      el("fMinerio").value = ""; desenhaMinerios(); window.scrollTo({top:0,behavior:"smooth"});
    });
  }
  if(sec==="encantar"){
    desenhaKits(); desenhaEnc();
    on("fKit","change",desenhaKits); on("qKit","input",desenhaKits);
    on("fEnc","change",desenhaEnc); on("qEnc","input",desenhaEnc);
  }
  if(sec==="villagers"){
    desenhaChk(); desenhaVil();
    on("fChkCat","change",desenhaChk); on("fChkStatus","change",desenhaChk); on("qChk","input",desenhaChk);
    on("fVil","change",desenhaVil); on("qVil","input",desenhaVil);
    const g = el("gradeChk");
    if(g) g.addEventListener("change", ev=>{
      const c = ev.target.closest("[data-chk]"); if(!c) return;
      if(c.checked) marcados[c.dataset.chk] = true; else delete marcados[c.dataset.chk];
      salvar(); desenhaChk();
    });
    on("chkLimpar","click",()=>{
      if(!window.confirm("Desmarcar todos os villagers da checklist? Isso vale para todo mundo que abrir a página.")) return;
      marcados = {}; salvar(); desenhaChk();
    });
    if(dbRef){ const p = el("chkSync"); if(p){ p.textContent="compartilhado"; p.classList.add("live"); } }
  }
  if(sec==="pocoes"){ desenhaPoc(); on("fPoc","change",desenhaPoc); on("qPoc","input",desenhaPoc); }
  if(sec==="farms"){
    desenhaMat(); desenhaFarms();
    on("qMat","input",desenhaMat);
    on("fFarm","change",desenhaFarms); on("qFarm","input",desenhaFarms);
  }
  if(sec==="redstone"){ desenhaRed(); on("fRed","change",desenhaRed); on("qRed","input",desenhaRed); }
}

/* ---- inicio ---- */
montarNav();
abrir((location.hash||"").replace("#","") || "entrar");
ligarDb();

/* A barra lateral gruda logo abaixo do topo. Medimos a altura de verdade em
   vez de chutar um numero fixo: com a fonte ainda carregando, com zoom ou
   com o nome maior, o chute deixaria a navegacao por cima do texto. */
(function medirTopo(){
  const topo = document.querySelector(".topbar");
  if(!topo) return;
  const aplica = () => document.documentElement.style.setProperty(
    "--head-h", Math.round(topo.getBoundingClientRect().height) + "px");
  aplica();
  if(window.ResizeObserver) new ResizeObserver(aplica).observe(topo);
  else addEventListener("resize", aplica);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(aplica);
})();
</script>
